; Speed limit display (Raspberry Pi). Installed as /etc/speeddisplay/config.ini

[display]
; Per-device name shown in the app (SpeedDisplayPi1, SpeedDisplayPi2, ...)
name = SpeedDisplayPi1
state_path = /var/lib/speeddisplay/settings.json
; yes = do not touch the GPIO at all, only serve /preview.png (testing without panels)
preview_only = no

[network]
bind = 0.0.0.0
port = 8099

[security]
; Must be identical to APP_SECRET in the app (SpeedDisplayApp/src/secrets.js) and the ESP32 (secrets.h)
app_secret = 19b7beb6168fdfdaf5f6d0b2a16406b472e7407815336936

[panel]
; 3 x P10 RGB 32x16 (2727-8S, 1/8 scan) chained with the ribbon cables
rows = 16
cols = 32
chain = 3
; "speeddisplay" = our own pin mapping (see README): keeps GPIO 27 / 10 / 18 / 14 / 15 / 2 / 3 free
gpio_mapping = speeddisplay
; Pi 4 is too fast for most panels: 2..4
gpio_slowdown = 4
pwm_bits = 11
pwm_lsb_nanoseconds = 130
; 0 = normal. If the image is scrambled try multiplexing 1..18 / row_address_type 0..5
multiplexing = 0
row_address_type = 0
scan_mode = 0
; yes = do not use the PWM hardware (GPIO18 / onboard audio stay untouched); a bit more flicker
no_hardware_pulse = yes
rgb_sequence = RGB
; Same meaning as PANEL_ORDER_REVERSED / PANEL_FLIP_MASK in the ESP32 config.h
order_reversed = no
flip_mask = 0b010

[look]
ring = yes
ring_color = 0,70,255
ring_thickness = 2
digit_stroke = 3
digit_w = 10
digit_h = 18
digit_gap = 2

[video]
; Video mode (switched from the app): plays every video on the USB stick in a loop.
; fill = fill the sign and cut the sides, fit = whole picture with black bars
fit = fill
fps = 30
; extra folders that are played too (besides the USB stick), comma separated.
; Copy videos into ~/speeddisplay/videos over SSH (scp) and they play from the next video on.
dirs = /var/lib/speeddisplay/videos, /home/housys/speeddisplay/videos

[defaults]
; used only on the very first start
limit = 40
brightness = 125
; 0 Red, 1 White, 2 Yellow, 3 Green, 4 Amber, 5 Cyan
digit_color = 0
text_color = 3
